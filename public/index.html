<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101014" />
    <meta name="description" content="ClouvenBot, the official Discord community assistant for ClouvenTwo." />
    <title>ClouvenBot</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #101014; color: #f5f5f7; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at top, #20202b 0, #101014 55%); }
      main { width: min(100%, 560px); padding: 36px; border: 1px solid #30303a; border-radius: 24px; background: rgb(23 23 29 / 88%); box-shadow: 0 24px 80px rgb(0 0 0 / 25%); }
      .mark { display: grid; place-items: center; width: 52px; height: 52px; margin-bottom: 24px; border-radius: 16px; background: #e7e7eb; color: #15151a; font-weight: 800; font-size: 22px; }
      h1 { margin: 0; font-size: clamp(2rem, 7vw, 3rem); letter-spacing: -.06em; }
      p { color: #b8b8c4; line-height: 1.7; }
      .status { display: inline-flex; align-items: center; gap: 9px; margin-top: 12px; padding: 9px 12px; border: 1px solid #353540; border-radius: 999px; color: #d7d7df; font-size: .9rem; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #9b9ba8; }
      footer { margin-top: 30px; padding-top: 18px; border-top: 1px solid #30303a; color: #858592; font-size: .8rem; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">C</div>
      <h1>ClouvenBot</h1>
      <p>The official Discord community assistant for ClouvenTwo. This page confirms that the web deployment is reachable; Discord interactions are handled by a separate API endpoint.</p>
      <div class="status"><span class="dot" aria-hidden="true"></span> Service landing page</div>
      <footer>ClouvenTwo community · Serverless Discord interactions</footer>
    </main>
  </body>
</html>
